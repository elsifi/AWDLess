name: AWDLess
options:
  bundleIdPrefix: com.elsifi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: KEYC53CXGS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  AWDLess:
    type: application
    platform: macOS
    sources:
      - path: AWDLess
      - path: Shared
      - path: AWDLessHelper/com.elsifi.AWDLess.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: AWDLess/Info.plist
      properties:
        CFBundleDisplayName: AWDLess
        CFBundleName: AWDLess
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Mohamed ElSifi. MIT License."
        LSMinimumSystemVersion: "14.0"
        CFBundleURLTypes:
          - CFBundleURLName: com.elsifi.AWDLess
            CFBundleURLSchemes: [awdless]
    entitlements:
      path: AWDLess/AWDLess.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elsifi.AWDLess
        PRODUCT_NAME: AWDLess
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AWDLessHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
  AWDLessHelper:
    type: tool
    platform: macOS
    sources:
      - path: AWDLessHelper
        excludes: ["*.plist"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elsifi.AWDLess.Helper
        PRODUCT_NAME: AWDLessHelper
        SKIP_INSTALL: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: AWDLessHelper/Info.plist
        INFOPLIST_PREPROCESS: NO
schemes:
  AWDLess:
    build:
      targets:
        AWDLess: all
    run:
      config: Debug
    archive:
      config: Release
